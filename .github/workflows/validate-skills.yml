name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  skill-shadowing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject skill-name shadowing
        run: bash scripts/check-skill-shadowing.sh
      - name: Validate market-search metadata
        run: |
          python3 scripts/check-market-search-metadata.py
          python3 -m unittest discover -s scripts -p 'test_check_market_search_metadata.py'
      - name: MiniMax H3 Max contract regression
        run: python3 -m unittest discover -s minimax-h3-max/scripts -p 'test_*.py'
