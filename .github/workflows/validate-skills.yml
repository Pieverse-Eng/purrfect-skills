name: Validate skills

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Explicit candidate qualification; ordinary skill PRs keep the checks below.
  injective-command-contract:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Reviewed candidate source; this is not a released minimum CLI version.
      PURR_CLI_SHA: edf9124f2259f203c47368b09cbdd42a8f38f712
    steps:
      - uses: actions/checkout@v4
      - name: Check out the public CLI candidate
        uses: actions/checkout@v4
        with:
          repository: Pieverse-Eng/purr-cli
          ref: ${{ env.PURR_CLI_SHA }}
          path: cli-candidate
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked CLI dependencies
        working-directory: cli-candidate
        run: bun install --frozen-lockfile
      - name: Compile the actual CLI candidate
        working-directory: cli-candidate
        run: >-
          bun build packages/cli/src/linux-macos.ts --compile --target=bun-linux-x64
          --outfile "$RUNNER_TEMP/purr" --define "PURR_VERSION='candidate-${PURR_CLI_SHA}'"
      - name: Execute every authored Injective command and error boundary
        env:
          PURR_TEST_BINARY: ${{ runner.temp }}/purr
        run: node tests/skills/injective-command-contract.mjs
      - name: Record candidate provenance
        run: |
          sha256sum "$RUNNER_TEMP/purr" > "$RUNNER_TEMP/purr.sha256"
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/purr-provenance.json", JSON.stringify({cliSource:process.env.PURR_CLI_SHA,skillsCheckout:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID},null,2))'
      - uses: actions/upload-artifact@v4
        with:
          name: injective-cli-contract-${{ env.PURR_CLI_SHA }}
          path: |
            ${{ runner.temp }}/purr.sha256
            ${{ runner.temp }}/purr-provenance.json
          retention-days: 14
  skill-shadowing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject skill-name shadowing
        run: bash scripts/check-skill-shadowing.sh
      - name: MiniMax H3 Max contract regression
        run: python3 -m unittest discover -s minimax-h3-max/scripts -p 'test_*.py'
      - name: News2Trading publication and runtime packaging regression
        run: |
          python3 -m unittest discover -s news2trading/scripts -p 'test_*.py'
          node --test scripts/test-materialize-news2trading.mjs
      - name: Smart Robinhood LP contract regression
        run: python3 -m unittest discover -s smart-robinhood-lp/scripts -p 'test_*.py'
      - name: Hyperliquid read-only size arithmetic regression
        run: node --test tests/skills/hyperliquid-order-size.test.mjs
