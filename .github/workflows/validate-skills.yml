name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  skill-shadowing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject skill-name shadowing
        run: bash scripts/check-skill-shadowing.sh
      - name: Reject CEX hosted-boundary regressions
        run: bash scripts/check-cex-hosted-boundary.sh
