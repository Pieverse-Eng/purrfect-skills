name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  skill-shadowing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject skill-name shadowing
        run: bash scripts/check-skill-shadowing.sh
      - name: MiniMax H3 Max contract regression
        run: python3 -m unittest discover -s minimax-h3-max/scripts -p 'test_*.py'
      - name: News2Trading publication and runtime packaging regression
        run: |
          python3 -m unittest discover -s news2trading/scripts -p 'test_*.py'
          node --test scripts/test-materialize-news2trading.mjs
      - name: Smart Robinhood LP contract regression
        run: python3 -m unittest discover -s smart-robinhood-lp/scripts -p 'test_*.py'
